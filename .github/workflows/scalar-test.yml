on: push
jobs:
  control:
    if: >
      ${{ true }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "should run"
  compound-false:
    if: >
      ${{ github.event_name != 'push' || github.repository_id == 0 &&
      (!(false)) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "should NOT run"
