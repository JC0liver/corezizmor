name: Vulnerable zizmor validation

"on":
  workflow_dispatch:
    inputs:
      message:
        description: Message to print
        required: true
        default: hello

permissions: {}

jobs:
  validate:
    name: Validate vulnerable workflow
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Print untrusted input
        run: echo "${{ inputs.message }}"
