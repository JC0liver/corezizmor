name: Zizmor GitHub Actions security analysis

# Audits the repository's GitHub Actions workflows with zizmor and publishes
# the findings to the GitHub Security > Code scanning tab (SARIF upload).
# This complements the pass/fail zizmor lint gate in ci.yaml.

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  schedule:
    # Weekly re-scan (Mondays 05:30 UTC) so the code scanning results stay fresh.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Check GitHub Actions workflows (code scanning)
    runs-on: ubuntu-24.04
    permissions:
      contents: read # To check out the repository
      security-events: write # To upload the SARIF results to code scanning
      actions: read # To read workflow metadata
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Match the upstream home-assistant/core lint gate, which runs with --pedantic.
          persona: pedantic
          # Emit SARIF and upload it to the repository's Security > Code scanning tab.
          advanced-security: true
