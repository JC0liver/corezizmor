name: Zizmor GitHub Actions security analysis

# Audits the repository's GitHub Actions workflows with zizmor, publishes
# findings to GitHub Code scanning, and enforces the pre-commit policy.

"on":
  push:
    branches:
      - dev
    paths:
      - .github/actions/**
      - .github/workflows/**
  pull_request:
    branches:
      - dev
    paths:
      - .github/actions/**
      - .github/workflows/**
  schedule:
    # Weekly re-scan (Mondays 05:30 UTC) so the code scanning results stay fresh.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  zizmor:
    name: Check GitHub Actions workflows (code scanning)
    runs-on: ubuntu-24.04
    permissions:
      contents: read # To check out the repository
      security-events: write # To upload the SARIF results to code scanning
      actions: read # To read workflow metadata
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish zizmor findings
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          persona: pedantic
          advanced-security: true
          config: .github/zizmor.yml

      - name: Enforce zizmor policy
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          extra-args: >-
            --all-files
            zizmor
            --
            --min-severity=medium
