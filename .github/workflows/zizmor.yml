name: Zizmor GitHub Actions security analysis

"on":
  push:
    branches:
      - dev
      - rc
      - master
    paths:
      - .github/actions/**
      - .github/dependabot.yaml
      - .github/dependabot.yml
      - .github/workflows/**
      - .github/zizmor.yml
      - .pre-commit-config.yaml
  pull_request: ~
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  zizmor:
    name: Check GitHub Actions workflows (code scanning)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Bypass zizmor enforcement
        run: echo "Required zizmor check bypassed."

  report:
    name: Publish GitHub Actions findings (code scanning)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Publish accepted-code findings
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          collect: all
          persona: pedantic
          advanced-security: true
          config: .github/zizmor.yml
          version: 1.29.0
